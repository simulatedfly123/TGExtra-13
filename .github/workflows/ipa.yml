name: Build TGExtra IPA

on:
  workflow_dispatch:
    inputs:
      decrypted_ipa_url:
        description: "Direct URL of the decrypted Telegram IPA (leave empty to use the .ipa asset of the 'ipa-source' release)"
        required: false
        type: string
  workflow_call:
    inputs:
      ipa_artifact:
        description: "Name of an artifact of the calling run that contains Telegram.ipa"
        required: true
        type: string

jobs:
  build:
    name: Build tweak and inject into IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'waruhachi/theos'
          theos-branch: 'main'
          sdks-src: 'waruhachi/sdks'
          sdks-branch: 'main'

      - name: Build package
        run: |
          make clean package FINALPACKAGE=1 STRIP=0
          ls -la packages

      - name: Download Telegram IPA artifact
        if: ${{ inputs.ipa_artifact != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.ipa_artifact }}
          path: ipa_artifact

      - name: Get decrypted IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IPA_URL: ${{ inputs.decrypted_ipa_url }}
        run: |
          if [ -d ipa_artifact ]; then
            mv "$(ls ipa_artifact/*.ipa | head -n1)" decrypted.ipa
          elif [ -n "$IPA_URL" ]; then
            curl -L -A "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)" -o decrypted.ipa "$IPA_URL"
          else
            gh release download ipa-source --repo "$GITHUB_REPOSITORY" --pattern '*.ipa' --output decrypted.ipa
          fi
          rm -rf ipa_check && mkdir ipa_check && unzip -q decrypted.ipa -d ipa_check
          APP=$(ls -d ipa_check/Payload/*.app | head -n1)
          EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          IPA_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          IPA_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          echo "Bundle: $IPA_BUNDLE_ID $IPA_VERSION"
          if otool -l "$APP/$EXEC" | grep -A4 LC_ENCRYPTION_INFO | grep -q "cryptid 1"; then
            echo "::error::$EXEC is still FairPlay-encrypted, a decrypted IPA is required"
            exit 1
          fi
          echo "IPA_BUNDLE_ID=$IPA_BUNDLE_ID" >> "$GITHUB_ENV"
          echo "IPA_VERSION=$IPA_VERSION" >> "$GITHUB_ENV"
          rm -rf ipa_check

      - name: Install cyan and ipapatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip
          if [[ "$(uname -m)" == "arm64" ]]; then ASSET="ipapatch.macos-arm64"; else ASSET="ipapatch.macos-amd64"; fi
          gh release download --repo asdfzxcvbn/ipapatch --pattern "$ASSET" --dir .
          mkdir -p bin && mv "$ASSET" bin/ipapatch && chmod +x bin/ipapatch
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Inject TGExtra and patch for sideloading
        run: |
          DEB=$(ls packages/*_iphoneos-arm.deb | head -n1)
          TGEXTRA_VERSION=$(echo "$DEB" | sed -E 's/.*com\.choco\.tg_([0-9.]+)_.+\.deb/\1/')
          OUT_BASE="$IPA_BUNDLE_ID-$IPA_VERSION-TGExtra-$TGEXTRA_VERSION"
          mkdir -p artifacts

          cyan -i decrypted.ipa -o "artifacts/$OUT_BASE.ipa" -uwsgqf "$DEB" TGExtra.bundle
          cp "artifacts/$OUT_BASE.ipa" "artifacts/$OUT_BASE.tipa"

          ipapatch --input "artifacts/$OUT_BASE.ipa" --inplace --noconfirm
          ipapatch --input "artifacts/$OUT_BASE.tipa" --inplace --noconfirm

          cp "$DEB" artifacts/
          (cd artifacts && shasum -a 256 * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tgextra-ipa
          path: artifacts/*
          retention-days: 7
