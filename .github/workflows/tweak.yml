name: Build tweak only

on:
  workflow_dispatch:

jobs:
  build:
    name: Build TGExtra .deb
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Same steps as waruhachi/theos-action, minus its cache: on a cache hit the
      # action runs update-theos, which expects an origin/master branch the fork lacks.
      - name: Install Theos dependencies
        run: |
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"
          brew install make ldid
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Set up Theos
        uses: actions/checkout@v4
        with:
          repository: waruhachi/theos
          ref: main
          submodules: recursive
          path: theos

      - name: Set up SDKs
        uses: actions/checkout@v4
        with:
          repository: waruhachi/sdks
          ref: main
          submodules: recursive
          path: theos/sdks

      - name: Build package
        run: |
          make clean package FINALPACKAGE=1 STRIP=0
          ls -la packages

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: tgextra-deb
          path: packages/*.deb
          retention-days: 3
